<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>เกมจับคู่การ์ด</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;overflow:hidden;
    touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  body{
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,#c9f0ff 0%,#e8f8ff 45%,#fff4d6 100%);
    height:100dvh;
    padding:calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
  }

  /* ---------- HUD ---------- */
  #hud{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:clamp(20px,5vw,30px);
    font-weight:900;color:#ff4f9a;
    text-shadow:0 2px 0 #fff,0 0 12px #fff;
    padding:4px 0 10px;
  }
  #hud .star{font-size:1.15em;filter:drop-shadow(0 2px 0 #e6a700);}

  /* ---------- กระดานการ์ด ---------- */
  #board{
    flex:0 0 auto;
    margin:auto;
    width:min(94vw, 520px, 46.5vh);
    aspect-ratio:3 / 4;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:clamp(8px,2vw,14px);
    perspective:1000px;
  }

  .card{
    position:relative;
    cursor:pointer;
    container-type:size;
    -webkit-tap-highlight-color:transparent;
  }
  .card-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .38s cubic-bezier(.2,.8,.3,1.2);
  }
  .card.flipped .card-inner,
  .card.matched .card-inner{transform:rotateY(180deg);}

  .face{
    position:absolute;inset:0;
    border-radius:clamp(12px,3.5vw,22px);
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;
  }

  /* ด้านหลังการ์ด (ลาย) */
  .face-down{
    background:linear-gradient(145deg,#7dd3fc,#38bdf8 55%,#0ea5e9);
    box-shadow:0 5px 0 #0284c7, 0 8px 16px rgba(2,132,199,.25);
    border:3px solid #fff;
  }
  .face-down::after{
    content:"✨";
    font-size:clamp(26px,9vmin,54px);
    opacity:.85;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));
  }

  /* ด้านหน้า (รูปสัตว์) */
  .face-up{
    transform:rotateY(180deg);
    background:#fff;
    box-shadow:0 5px 0 #e2e8f0, 0 8px 16px rgba(0,0,0,.12);
    border:3px solid #fff;
    font-size:clamp(38px,13vmin,72px);
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    line-height:1;
  }

  .card.matched{pointer-events:none;}
  .card.matched .face-up{
    background:linear-gradient(160deg,#fff9c4,#ffe082);
    box-shadow:0 5px 0 #fbc02d, 0 0 22px rgba(251,192,45,.85);
    animation:matchPop .45s ease;
  }
  @keyframes matchPop{
    0%{transform:rotateY(180deg) scale(1);}
    45%{transform:rotateY(180deg) scale(1.12);}
    100%{transform:rotateY(180deg) scale(1);}
  }
  .card.shake .card-inner{animation:shake .45s ease;}
  @keyframes shake{
    0%,100%{transform:rotateY(180deg) translateX(0);}
    25%{transform:rotateY(180deg) translateX(-7px);}
    75%{transform:rotateY(180deg) translateX(7px);}
  }

  /* ---------- คำใบ้ ---------- */
  #hint{
    position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:2px;
    pointer-events:none;transition:opacity .4s;
    font-size:clamp(18px,4.5vw,24px);font-weight:800;color:#ff4f9a;
    text-shadow:0 2px 0 #fff,0 0 14px #fff;
    z-index:6;
  }
  #hint .hand{font-size:clamp(40px,12vw,64px);animation:tap 1.1s ease-in-out infinite;}
  @keyframes tap{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-14px) scale(1.1);}}
  #hint.hide{opacity:0;}

  /* ---------- หน้าจอชนะ ---------- */
  #win{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    text-align:center;padding:20px;
  }
  #win.hidden{display:none;}
  .win-emoji{font-size:clamp(64px,20vw,110px);animation:bounce 1s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}
  .win-title{
    font-size:clamp(30px,9vw,52px);font-weight:900;color:#ff4f9a;
    text-shadow:0 4px 0 #fff,0 0 26px #fff;
  }
  .win-sub{font-size:clamp(18px,5vw,26px);font-weight:800;color:#0ea5e9;}
  #replay{
    margin-top:8px;
    font-family:inherit;font-size:clamp(22px,6.5vw,34px);font-weight:900;
    padding:.55em 1.4em;border:none;border-radius:999px;color:#6b3f00;
    background:linear-gradient(180deg,#ffd93b,#ffb300);
    box-shadow:0 8px 0 #d68f00, 0 14px 26px rgba(0,0,0,.18);
    cursor:pointer;
  }
  #replay:active{transform:translateY(5px);box-shadow:0 3px 0 #d68f00;}

  /* ---------- แคนวาสเอฟเฟกต์ ---------- */
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15;}

  @supports (font-size:1cqw){
    .face-up{font-size:58cqw;}
    .face-down::after{font-size:42cqw;}
  }
</style>
<link rel="stylesheet" href="assets/arcade-nav.css">
</head>
<body class="arcade-integrated">
<a class="arcade-return" href="index.html" lang="en">&#8592; Back to Arcade</a>

<div id="hud">
  <span class="star">⭐</span>
  <span>จับคู่ได้ <span id="pairs">0</span>/6</span>
</div>

<main id="board" aria-label="กระดานจับคู่การ์ด"></main>

<div id="hint"><div class="hand">👆</div><div>แตะการ์ดเพื่อเปิด</div></div>

<canvas id="fx"></canvas>

<div id="win" class="hidden">
  <div class="win-emoji">🎉</div>
  <div class="win-title">เก่งมาก!</div>
  <div class="win-sub">จับคู่ครบทุกคู่แล้ว</div>
  <button id="replay">เล่นอีกครั้ง</button>
</div>

<script>
(function(){
  const board   = document.getElementById('board');
  const pairsEl = document.getElementById('pairs');
  const hintEl  = document.getElementById('hint');
  const winEl   = document.getElementById('win');
  const replay  = document.getElementById('replay');
  const canvas  = document.getElementById('fx');
  const ctx     = canvas.getContext('2d');

  const EMOJIS = ['🐶','🐱','🐰','🐼','🦁','🐸'];
  const TOTAL_PAIRS = EMOJIS.length;

  let firstEl = null;      // การ์ดใบแรกที่เปิด
  let lock = false;        // ล็อกระหว่างรอพลิกกลับ
  let matchedCount = 0;
  let gameOver = false;

  /* ================= เสียง ================= */
  let ac = null;
  function initAudio(){
    if(!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) ac = new AC();
    }
    if(ac && ac.state === 'suspended') ac.resume();
  }
  function tone(freq, start, dur, type, vol){
    if(!ac) return;
    const t = ac.currentTime + start;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function sndFlip(){ tone(760, 0, 0.09, 'sine', 0.13); }
  function sndMatch(){
    tone(660, 0, 0.14, 'triangle', 0.2);
    tone(990, 0.1, 0.22, 'triangle', 0.2);
  }
  function sndWrong(){
    tone(220, 0, 0.16, 'sawtooth', 0.12);
    tone(170, 0.1, 0.2, 'sawtooth', 0.1);
  }
  function sndWin(){
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function(f, i){
      tone(f, i * 0.11, 0.4, 'triangle', 0.18);
    });
  }

  /* ================= เอฟเฟกต์ ================= */
  let W = 0, H = 0, DPR = 1;
  function resizeFx(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resizeFx);

  let particles = [];
  function addBurst(x, y, count, power){
    for(let i = 0; i < count; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = power * (0.35 + Math.random());
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - power * 0.45,
        size: 4 + Math.random() * 8,
        life: 0.7 + Math.random() * 0.7,
        maxLife: 1.4,
        color: 'hsl(' + ((Math.random() * 360) | 0) + ',95%,64%)',
        rot: Math.random() * 6,
        vr: (Math.random() - 0.5) * 16,
        shape: Math.random() < 0.55 ? 'rect' : 'circle'
      });
    }
  }
  function burstAtElement(el, count, power){
    const r = el.getBoundingClientRect();
    addBurst(r.left + r.width / 2, r.top + r.height / 2, count, power);
  }
  function bigConfetti(){
    for(let i = 0; i < 90; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 220 + Math.random() * 520;
      particles.push({
        x: W / 2, y: H * 0.38,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 260,
        size: 5 + Math.random() * 9,
        life: 1.0 + Math.random() * 0.8,
        maxLife: 1.8,
        color: 'hsl(' + ((Math.random() * 360) | 0) + ',95%,64%)',
        rot: Math.random() * 6,
        vr: (Math.random() - 0.5) * 20,
        shape: Math.random() < 0.6 ? 'rect' : 'circle'
      });
    }
  }

  let last = performance.now();
  function fxLoop(now){
    let dt = (now - last) / 1000;
    last = now;
    if(dt > 0.05) dt = 0.05;

    ctx.clearRect(0, 0, W, H);
    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.life -= dt;
      if(p.life <= 0){ particles.splice(i, 1); continue; }
      p.vy += 980 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;

      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
      if(p.shape === 'rect'){
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.55, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(fxLoop);
  }

  /* ================= เกม ================= */
  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = (Math.random() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function buildDeck(){
    const deck = [];
    EMOJIS.forEach(function(emoji){
      deck.push(emoji);
      deck.push(emoji);
    });
    return shuffle(deck);
  }

  function renderBoard(){
    board.innerHTML = '';
    const deck = buildDeck();

    deck.forEach(function(emoji){
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;

      const inner = document.createElement('div');
      inner.className = 'card-inner';

      const back = document.createElement('div');
      back.className = 'face face-down';

      const front = document.createElement('div');
      front.className = 'face face-up';
      front.textContent = emoji;

      inner.appendChild(back);
      inner.appendChild(front);
      card.appendChild(inner);
      board.appendChild(card);
    });
  }

  function updateProgress(){
    pairsEl.textContent = matchedCount;
  }

  function onCardTap(card){
    if(gameOver || lock) return;
    if(card.classList.contains('flipped') || card.classList.contains('matched')) return;

    initAudio();
    hintEl.classList.add('hide');

    card.classList.add('flipped');
    sndFlip();

    if(!firstEl){
      firstEl = card;
      return;
    }

    const a = firstEl;
    const b = card;
    firstEl = null;
    lock = true;

    if(a.dataset.emoji === b.dataset.emoji){
      // ---------- ถูกต้อง ----------
      setTimeout(function(){
        a.classList.add('matched');
        b.classList.add('matched');
        matchedCount++;
        updateProgress();
        sndMatch();
        burstAtElement(a, 16, 260);
        burstAtElement(b, 16, 260);
        lock = false;

        if(matchedCount === TOTAL_PAIRS){
          winGame();
        }
      }, 320);
    } else {
      // ---------- ผิด ----------
      sndWrong();
      a.classList.add('shake');
      b.classList.add('shake');
      setTimeout(function(){
        a.classList.remove('flipped', 'shake');
        b.classList.remove('flipped', 'shake');
        lock = false;
      }, 950);
    }
  }

  function winGame(){
    gameOver = true;
    bigConfetti();
    sndWin();
    setTimeout(function(){
      winEl.classList.remove('hidden');
    }, 450);
  }

  board.addEventListener('pointerdown', function(e){
    const card = e.target.closest('.card');
    if(card) onCardTap(card);
  });

  replay.addEventListener('click', function(){
    initAudio();
    winEl.classList.add('hidden');
    matchedCount = 0;
    firstEl = null;
    lock = false;
    gameOver = false;
    particles.length = 0;
    updateProgress();
    renderBoard();
    hintEl.classList.remove('hide');
  });

  // กันการซูม/เลื่อนหน้า
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive: false });

  /* ================= เริ่มต้น ================= */
  resizeFx();
  requestAnimationFrame(fxLoop);
  renderBoard();
  updateProgress();
})();
</script>
</body>
</html>
