<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>เกมต่อแบบรูป</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;overflow:hidden;
    touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  body{
    display:flex;flex-direction:column;
    height:100dvh;
    padding:calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#d8f3ff 0%,#eefaff 40%,#fff6d9 100%);
  }

  /* ---------- HUD ---------- */
  #hud{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:2px 4px 6px;
    font-size:clamp(19px,4.6vw,26px);font-weight:900;
  }
  #scoreWrap{color:#ff4f9a;text-shadow:0 2px 0 #fff,0 0 12px #fff;}
  #scoreWrap .star{font-size:1.1em;filter:drop-shadow(0 2px 0 #e6a700);}
  #levelTag{
    color:#0ea5e9;text-shadow:0 2px 0 #fff,0 0 12px #fff;
    display:flex;align-items:center;gap:6px;
  }
  #levelTag .dot{
    width:.62em;height:.62em;border-radius:50%;
    background:#bae6fd;box-shadow:inset 0 0 0 2px #7dd3fc;
    transition:background .25s, box-shadow .25s;
  }
  #levelTag .dot.on{background:#facc15;box-shadow:0 0 8px #fbbf24;}

  /* ---------- พื้นที่เล่น ---------- */
  #stage{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;
    justify-content:center;gap:clamp(16px,4.5vh,40px);
    width:100%;max-width:560px;margin:0 auto;
  }

  /* แถวแบบรูป */
  #pattern{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(6px,1.8vw,12px);
    width:100%;
  }
  .tile{
    flex:1 1 0;min-width:0;max-width:78px;
    aspect-ratio:1;
    border-radius:clamp(12px,3.4vw,20px);
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(170deg,#ffffff,#eaf7ff);
    border:3px solid #fff;
    box-shadow:0 5px 0 #bfe4f7, 0 9px 16px rgba(2,132,199,.14);
    font-size:clamp(24px,8.6vmin,44px);
    line-height:1;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    animation:tileIn .3s ease backwards;
  }
  @keyframes tileIn{from{opacity:0;transform:scale(.7) translateY(10px);}to{opacity:1;transform:none;}}

  .tile.q{
    background:linear-gradient(170deg,#fff7d6,#ffe9a8);
    border:3px dashed #f5b301;
    box-shadow:0 5px 0 #f0c14b, 0 9px 16px rgba(214,143,0,.2);
    color:#e08b00;font-weight:900;
    font-size:clamp(26px,9.4vmin,48px);
    animation:qPulse 1.15s ease-in-out infinite;
  }
  @keyframes qPulse{
    0%,100%{transform:scale(1);box-shadow:0 5px 0 #f0c14b,0 9px 16px rgba(214,143,0,.2);}
    50%{transform:scale(1.07);box-shadow:0 5px 0 #f0c14b,0 0 24px rgba(250,204,21,.85);}
  }
  .tile.q.filled{
    animation:fillPop .5s cubic-bezier(.2,1.7,.5,1) forwards;
    background:linear-gradient(170deg,#dcfce7,#86efac);
    border:3px solid #22c55e;
    box-shadow:0 5px 0 #16a34a, 0 0 26px rgba(34,197,94,.75);
    color:#166534;
  }
  @keyframes fillPop{
    0%{transform:scale(.5) rotate(-12deg);}
    60%{transform:scale(1.22) rotate(4deg);}
    100%{transform:scale(1) rotate(0);}
  }

  /* ปุ่มตัวเลือก */
  #choices{
    display:flex;justify-content:center;
    gap:clamp(12px,3.5vw,22px);
    width:100%;
  }
  .choice{
    flex:1 1 0;min-width:0;max-width:118px;
    aspect-ratio:1;
    border-radius:clamp(18px,5vw,28px);
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#ffffff,#eaf7ff);
    border:4px solid #fff;
    box-shadow:0 8px 0 #a5d8f0, 0 14px 22px rgba(2,132,199,.16);
    font-size:clamp(34px,11.5vmin,62px);
    line-height:1;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .3s;
    animation:choiceIn .35s ease backwards;
  }
  .choice:nth-child(1){animation-delay:.05s;}
  .choice:nth-child(2){animation-delay:.12s;}
  .choice:nth-child(3){animation-delay:.19s;}
  @keyframes choiceIn{from{opacity:0;transform:translateY(18px) scale(.85);}to{opacity:1;transform:none;}}
  .choice:active{transform:translateY(6px);box-shadow:0 2px 0 #a5d8f0;}

  .choice.correct{
    background:linear-gradient(180deg,#dcfce7,#86efac);
    box-shadow:0 8px 0 #16a34a, 0 0 30px rgba(34,197,94,.8);
    transform:translateY(-4px) scale(1.06);
  }
  .choice.wrong{
    animation:wrongShake .45s ease;
    background:linear-gradient(180deg,#ffe4e6,#fecdd3);
    box-shadow:0 8px 0 #f43f5e;
  }
  @keyframes wrongShake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-9px) rotate(-4deg);}
    50%{transform:translateX(9px) rotate(4deg);}
    80%{transform:translateX(-5px);}
  }
  .choice.dim{opacity:.35;pointer-events:none;}

  /* ---------- เอฟเฟกต์ ---------- */
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15;}

  #toast{
    position:fixed;left:0;right:0;top:26%;
    text-align:center;pointer-events:none;z-index:16;
    font-size:clamp(30px,9vw,60px);font-weight:900;color:#ff4f9a;
    text-shadow:0 5px 0 #fff,0 0 26px #fff;
    opacity:0;transform:scale(.5);
    transition:opacity .18s ease, transform .25s cubic-bezier(.2,1.7,.5,1);
  }
  #toast.show{opacity:1;transform:scale(1);}
</style>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/arcade-nav.css">
</head>
<body class="arcade-integrated">
<a class="arcade-return" href="index.html" lang="en">&#8592; Back to Arcade</a>

<div id="hud">
  <div id="scoreWrap"><span class="star">⭐</span> <span id="score">0</span></div>
  <div id="levelTag">
    <span id="dots"></span>
  </div>
</div>

<main id="stage">
  <div id="pattern"></div>
  <div id="choices"></div>
</main>

<canvas id="fx"></canvas>
<div id="toast"></div>

<script>
(function(){
  const patternEl = document.getElementById('pattern');
  const choicesEl = document.getElementById('choices');
  const scoreEl   = document.getElementById('score');
  const dotsEl    = document.getElementById('dots');
  const toastEl   = document.getElementById('toast');
  const canvas    = document.getElementById('fx');
  const ctx       = canvas.getContext('2d');

  /* ================= คลังรูป ================= */
  const THEMES = [
    ['🐶','🐱','🐰','🐼','🦁'],
    ['🍎','🍌','🍇','🍓','🍊'],
    ['🐟','🐙','🐢','🦀','🐬'],
    ['🚗','🚌','🚂','🚀','🚁'],
    ['☀️','🌙','⭐','🌈','☁️'],
    ['🌸','🌻','🍀','🌵','🍁']
  ];

  /* ================= เสียง ================= */
  let ac = null;
  function initAudio(){
    if(!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) ac = new AC();
    }
    if(ac && ac.state === 'suspended') ac.resume();
  }
  function tone(freq, delay, dur, type, vol){
    if(!ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.04);
  }
  function sndTap(){ tone(880, 0, 0.07, 'sine', 0.10); }
  function sndRight(){
    tone(660, 0, 0.13, 'triangle', 0.19);
    tone(880, 0.09, 0.16, 'triangle', 0.19);
    tone(1174, 0.18, 0.26, 'triangle', 0.16);
  }
  function sndWrong(){
    tone(200, 0, 0.15, 'sawtooth', 0.10);
    tone(150, 0.10, 0.19, 'sawtooth', 0.09);
  }

  /* ================= เอฟเฟกต์ ================= */
  let W = 0, H = 0, DPR = 1;
  function resizeFx(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resizeFx);

  const particles = [];
  function burst(x, y, count, power){
    for(let i = 0; i < count; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = power * (0.35 + Math.random());
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - power * 0.5,
        size: 4 + Math.random() * 8,
        life: 0.75 + Math.random() * 0.7,
        maxLife: 1.45,
        color: 'hsl(' + ((Math.random() * 360) | 0) + ',95%,64%)',
        rot: Math.random() * 6,
        vr: (Math.random() - 0.5) * 16,
        shape: Math.random() < 0.55 ? 'rect' : 'circle'
      });
    }
  }
  function burstAt(el, count, power){
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, count, power);
  }

  let lastT = performance.now();
  function fxLoop(now){
    let dt = (now - lastT) / 1000;
    lastT = now;
    if(dt > 0.05) dt = 0.05;

    ctx.clearRect(0, 0, W, H);
    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.life -= dt;
      if(p.life <= 0){ particles.splice(i, 1); continue; }
      p.vy += 1000 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;

      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
      if(p.shape === 'rect'){
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.55, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(fxLoop);
  }

  /* ================= สถานะเกม ================= */
  let score = 0;
  let roundNum = 1;
  let answer = null;
  let locked = false;

  function shuffle(a){
    for(let i = a.length - 1; i > 0; i--){
      const j = (Math.random() * (i + 1)) | 0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(a){ return a[(Math.random() * a.length) | 0]; }

  /* สร้างหน่วยของแบบรูป + จำนวนช่องที่โชว์ */
  function buildUnit(){
    const s = shuffle(pick(THEMES).slice());     // สุ่มรูป 5 ตัวในธีม

    if(roundNum <= 3){
      // AB
      return { unit:[s[0], s[1]], visible:4 };
    }
    if(roundNum <= 6){
      // ABC / ABB / AAB
      const kind = (Math.random() * 3) | 0;
      if(kind === 0) return { unit:[s[0], s[1], s[2]], visible:5 };
      if(kind === 1) return { unit:[s[0], s[1], s[1]], visible:5 };
      return { unit:[s[0], s[0], s[1]], visible:5 };
    }
    // ระดับสูง: ผสม AABB และแบบเดิม
    const kind = (Math.random() * 4) | 0;
    if(kind === 0) return { unit:[s[0], s[0], s[1], s[1]], visible:4 };
    if(kind === 1) return { unit:[s[0], s[1], s[2]], visible:5 };
    if(kind === 2) return { unit:[s[0], s[1], s[0], s[2]], visible:4 }; // ABAC
    return { unit:[s[0], s[1]], visible:4 };
  }

  const WORDS = ['เก่งมาก!','สุดยอด!','ใช่เลย!','ดีมาก!','เยี่ยม!','ฉลาดมาก!'];
  let toastTimer = null;
  function showToast(text){
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 850);
  }

  function updateDots(){
    const n = Math.min(10, roundNum);
    let html = '';
    for(let i = 0; i < 10; i++){
      html += '<span class="dot' + (i < (roundNum - 1) % 10 + 1 ? ' on' : '') + '"></span>';
    }
    dotsEl.innerHTML = html;
  }

  /* ================= สร้างรอบใหม่ ================= */
  function newRound(){
    locked = false;
    patternEl.innerHTML = '';
    choicesEl.innerHTML = '';
    updateDots();

    const { unit, visible } = buildUnit();

    // ต่อหน่วยให้ยาวพอ
    const full = [];
    while(full.length < visible + 1){
      for(let i = 0; i < unit.length; i++) full.push(unit[i]);
    }
    const shown = full.slice(0, visible);
    answer = full[visible];

    // วาดแถวแบบรูป
    shown.forEach(function(sym, i){
      const t = document.createElement('div');
      t.className = 'tile';
      t.textContent = sym;
      t.style.animationDelay = (i * 0.05) + 's';
      patternEl.appendChild(t);
    });

    const q = document.createElement('div');
    q.className = 'tile q';
    q.id = 'questionTile';
    q.textContent = '?';
    patternEl.appendChild(q);

    // ตัวเลือก 3 ข้อ (มีคำตอบ + ตัวลวงจากธีมเดียวกัน)
    const others = [];
    THEMES.forEach(function(theme){
      theme.forEach(function(sym){
        if(sym !== answer && others.indexOf(sym) === -1) others.push(sym);
      });
    });
    shuffle(others);
    const opts = shuffle([answer, others[0], others[1]]);

    opts.forEach(function(sym){
      const btn = document.createElement('div');
      btn.className = 'choice';
      btn.dataset.sym = sym;
      btn.textContent = sym;
      choicesEl.appendChild(btn);
    });
  }

  /* ================= ตอบ ================= */
  function choose(btn){
    if(locked) return;
    initAudio();

    if(btn.dataset.sym === answer){
      locked = true;
      sndRight();
      btn.classList.add('correct');
      Array.prototype.forEach.call(choicesEl.children, function(c){
        if(c !== btn) c.classList.add('dim');
      });

      const q = document.getElementById('questionTile');
      if(q){
        q.textContent = answer;
        q.classList.add('filled');
        q.style.animation = 'none';
        void q.offsetWidth;
        q.style.animation = '';
      }

      burstAt(btn, 20, 300);
      if(q) burstAt(q, 24, 340);

      score++;
      scoreEl.textContent = score;
      showToast(pick(WORDS));

      roundNum++;
      setTimeout(function(){
        newRound();
      }, 1150);

    } else {
      sndWrong();
      btn.classList.add('wrong');
      setTimeout(function(){ btn.classList.remove('wrong'); }, 480);
    }
  }

  choicesEl.addEventListener('pointerdown', function(e){
    const btn = e.target.closest('.choice');
    if(!btn) return;
    if(!btn.classList.contains('dim')) choose(btn);
  });

  /* กันซูม / เลื่อนหน้า */
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });

  /* ================= เริ่ม ================= */
  resizeFx();
  requestAnimationFrame(fxLoop);
  newRound();
})();
</script>
</body>
</html>
