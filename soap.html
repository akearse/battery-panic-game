<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>เกมตีฟองสบู่</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  body{background:linear-gradient(180deg,#a8e6ff 0%,#d6f4ff 45%,#fff6d0 100%);}
  canvas{display:block;width:100%;height:100%;}

  #hud{
    position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;
    display:flex;align-items:center;gap:8px;
    font-size:40px;font-weight:900;color:#fff;
    text-shadow:0 3px 0 #ff8fc4, 0 8px 14px rgba(0,0,0,.15);
    pointer-events:none;
  }
  #hud .star{font-size:38px;filter:drop-shadow(0 3px 0 #e6a700);}

  #praise{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:min(13vw,84px);font-weight:900;color:#ff4f9a;
    text-shadow:0 6px 0 #fff, 0 0 28px #fff, 0 10px 24px rgba(0,0,0,.15);
    opacity:0;transform:scale(.5);pointer-events:none;
    transition:opacity .2s ease, transform .2s cubic-bezier(.2,1.6,.5,1);
  }
  #praise.show{opacity:1;transform:scale(1);}

  #hint{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;
    pointer-events:none;transition:opacity .4s;
    font-size:26px;font-weight:800;color:#ff4f9a;
    text-shadow:0 3px 0 #fff,0 0 16px #fff;
  }
  #hint .hand{font-size:80px;animation:tap 1.1s ease-in-out infinite;}
  @keyframes tap{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.12)}}
  #hint.hide{opacity:0;}
</style>
<link rel="stylesheet" href="assets/arcade-nav.css">
</head>
<body class="arcade-soap">
<a class="arcade-return" href="index.html" lang="en">&#8592; Back to Arcade</a>
<canvas id="c"></canvas>
<div id="hud"><span class="star">⭐</span><span id="score">0</span></div>
<div id="praise"></div>
<div id="hint"><div class="hand">👆</div><div>แตะที่ฟองสบู่</div></div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const praiseEl = document.getElementById('praise');
  const hintEl = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  /* ---------- เสียง ---------- */
  let ac = null;
  function initAudio(){
    if(!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) ac = new AC();
    }
    if(ac && ac.state === 'suspended') ac.resume();
  }
  function popSound(){
    if(!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    const base = 380 + Math.random() * 320;
    o.type = 'sine';
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * 2.4, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.22);
  }
  function chime(){
    if(!ac) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const t = ac.currentTime + i * 0.09;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.42);
    });
  }

  /* ---------- ข้อมูลเกม ---------- */
  const EMOJIS = ['🐶','🐱','🐰','🐼','🦁','🐸','🐷','🐵','🐥','🦋',
                  '🍎','🍓','🍊','🍇','🍌','⭐','🌈','🎈','🌸','🐟'];

  let bubbles = [];
  let particles = [];
  let score = 0;
  let time = 0;
  let spawnCd = 0;

  function targetCount(){
    return Math.max(4, Math.min(9, Math.round((W * H) / 55000)));
  }

  function spawnBubble(){
    const minDim = Math.min(W, H);
    const r = Math.max(36, Math.min(minDim * 0.105, 78));
    const margin = r + 6;
    const baseX = margin + Math.random() * Math.max(1, (W - margin * 2));
    bubbles.push({
      baseX, x: baseX,
      y: H + r + Math.random() * 120,
      r,
      vy: -(H * 0.10 + Math.random() * H * 0.07),
      amp: 10 + Math.random() * 26,
      freq: 0.4 + Math.random() * 1.1,
      phase: Math.random() * Math.PI * 2,
      emoji: EMOJIS[(Math.random() * EMOJIS.length) | 0],
      hue: (Math.random() * 360) | 0
    });
  }

  /* ---------- เอฟเฟกต์ ---------- */
  function burst(x, y, hue, r){
    for(let i = 0; i < 14; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 130 + Math.random() * 280;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 90,
        size: 4 + Math.random() * 8,
        life: 0.65 + Math.random() * 0.4,
        maxLife: 1.05,
        color: `hsl(${(hue + Math.random() * 90 - 45 + 360) % 360}, 95%, 66%)`,
        shape: Math.random() < 0.45 ? 'rect' : 'circle',
        rot: Math.random() * 6,
        vr: (Math.random() - 0.5) * 14
      });
    }
    particles.push({
      ring: true, x, y, r: r * 0.55,
      life: 0.34, maxLife: 0.34,
      color: `hsl(${hue}, 95%, 72%)`
    });
  }

  function confetti(){
    const cx = W / 2, cy = H * 0.38;
    for(let i = 0; i < 70; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 180 + Math.random() * 480;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 220,
        size: 5 + Math.random() * 9,
        life: 0.9 + Math.random() * 0.7,
        maxLife: 1.6,
        color: `hsl(${Math.random() * 360}, 95%, 64%)`,
        shape: Math.random() < 0.6 ? 'rect' : 'circle',
        rot: Math.random() * 6,
        vr: (Math.random() - 0.5) * 18
      });
    }
  }

  const WORDS = ['เก่งมาก!','สุดยอด!','ว้าว!','ดีมาก!','เยี่ยม!','เจ๋งไปเลย!'];
  let praiseTimer = null;
  function showPraise(){
    praiseEl.textContent = WORDS[(Math.random() * WORDS.length) | 0];
    praiseEl.classList.add('show');
    clearTimeout(praiseTimer);
    praiseTimer = setTimeout(() => praiseEl.classList.remove('show'), 950);
  }

  /* ---------- การแตะ ---------- */
  function handleTap(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    for(let i = bubbles.length - 1; i >= 0; i--){
      const b = bubbles[i];
      const dx = x - b.x, dy = y - b.y;
      const hitR = b.r * 1.25;           // ใจดีกับนิ้วเล็ก ๆ
      if(dx * dx + dy * dy <= hitR * hitR){
        popBubble(i);
        return;
      }
    }
  }

  function popBubble(i){
    const b = bubbles[i];
    bubbles.splice(i, 1);
    burst(b.x, b.y, b.hue, b.r);
    popSound();

    score++;
    scoreEl.textContent = score;
    if(score % 10 === 0){
      showPraise();
      confetti();
      chime();
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    initAudio();
    hintEl.classList.add('hide');
    handleTap(e.clientX, e.clientY);
  }, { passive: false });

  // กันการซูม/เลื่อนหน้า
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  /* ---------- เกมลูป ---------- */
  function update(dt){
    time += dt;

    // เกิดฟองใหม่
    spawnCd -= dt;
    if(bubbles.length < targetCount() && spawnCd <= 0){
      spawnBubble();
      spawnCd = 0.55;
    }

    // เคลื่อนที่ฟอง
    for(let i = bubbles.length - 1; i >= 0; i--){
      const b = bubbles[i];
      b.y += b.vy * dt;
      b.x = b.baseX + Math.sin(time * b.freq + b.phase) * b.amp;
      if(b.y < -b.r * 1.5) bubbles.splice(i, 1);
    }

    // อนุภาค
    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.life -= dt;
      if(p.life <= 0){ particles.splice(i, 1); continue; }
      if(p.ring){
        p.r += 300 * dt;
      } else {
        p.vy += 950 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
      }
    }
  }

  function drawBubble(b){
    const g = ctx.createRadialGradient(
      b.x - b.r * 0.35, b.y - b.r * 0.38, b.r * 0.12,
      b.x, b.y, b.r
    );
    g.addColorStop(0, 'rgba(255,255,255,0.96)');
    g.addColorStop(0.55, `hsla(${b.hue},100%,82%,0.78)`);
    g.addColorStop(1, `hsla(${b.hue},90%,66%,0.58)`);

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.lineWidth = Math.max(2, b.r * 0.07);
    ctx.strokeStyle = `hsla(${b.hue},95%,72%,0.9)`;
    ctx.stroke();

    // ไฮไลต์
    ctx.beginPath();
    ctx.ellipse(b.x - b.r * 0.33, b.y - b.r * 0.4,
                b.r * 0.23, b.r * 0.13, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fill();

    // อีโมจิข้างใน
    ctx.font = `${Math.round(b.r * 1.02)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.emoji, b.x, b.y + b.r * 0.06);
  }

  function render(){
    ctx.clearRect(0, 0, W, H);

    // ฟองสบู่
    for(const b of bubbles) drawBubble(b);

    // อนุภาค
    for(const p of particles){
      const a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      if(p.ring){
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.lineWidth = 5;
        ctx.strokeStyle = p.color;
        ctx.stroke();
      } else if(p.shape === 'rect'){
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function loop(now){
    let dt = (now - last) / 1000;
    last = now;
    if(dt > 0.05) dt = 0.05;
    if(dt < 0) dt = 0;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  resize();
  // เริ่มด้วยฟอง 2–3 ลูก
  for(let i = 0; i < 3; i++){
    spawnBubble();
    bubbles[bubbles.length - 1].y = H * (0.55 + Math.random() * 0.4);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
